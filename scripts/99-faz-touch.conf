# Faz tahta dokunmatik çerçeveler her zaman libinput ile açılsın.
# Kalibrasyon matrisi sürücüde varsayılan (birim matris); eta-touchdrv
# ve Ayarlar > Ekran > Kalibre Et ile gerektiğinde düzeltilir.
Section "InputClass"
    Identifier "Faz touchscreen catchall"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "Tapping" "on"
EndSection
