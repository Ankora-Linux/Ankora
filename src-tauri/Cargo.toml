[package]
name = "ayaz-de"
version = "3.4.0"
description = "Ayaz Minimalist Kiosk Desktop Environment for Ankora Linux"
authors = ["Ankora Linux Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["window-start-dragging", "window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-unmaximize", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dirs = "7.0"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
url = "2.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
