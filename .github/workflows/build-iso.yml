name: Ankora Linux Canlı ISO Derleme (Live ISO Build)

# Ayaz DE (Devuan Daedalus SysVinit) canlı ISO imajını (.iso) ve iç Debian
# paketini (.deb) bulutta otomatik olarak derler. ISO dosya adı derleyiciden
# dinamik okunur; sürüm sabit kodlanmaz (3.3/3.4 çakışması düzeltildi).
# Manuel tetikleme: Actions -> Run workflow. Otomatik: v* etiketi push'u.

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Önbellekleri temizleyip sıfırdan derle'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# Sürüm yükleme (gh-release) GITHUB_TOKEN ile yazma izni ister.
permissions:
  contents: write

jobs:
  build-iso:
    name: Ankora Linux Hibrit Live ISO Derle
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Kaynak Kodları İndir (Checkout)
        uses: actions/checkout@v7

      - name: Rust Araç Setini Kur
        uses: dtolnay/rust-toolchain@stable

      - name: Derleme Önbelleği (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Gerekli Paketleri Kur (Tauri + ISO Oluşturucu Araçları)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Tauri CLI Kur
        run: cargo install tauri-cli --version "^1.5"

      - name: Sürüm Doğrulama (tauri.conf.json = VERSION)
        run: |
          VER_CONF=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          FILE_VER=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
          echo "tauri.conf.json: $VER_CONF / VERSION: $FILE_VER"
          if [ -n "$FILE_VER" ] && [ "$VER_CONF" != "$FILE_VER" ]; then
            echo "::error::Sürüm uyumsuzluğu: tauri.conf.json=$VER_CONF, VERSION=$FILE_VER"
            exit 1
          fi
          echo "ankora_version=$VER_CONF" >> "$GITHUB_ENV"

      - name: NPM Bağımlılıklarını Kur (deterministik)
        run: npm ci

      - name: Güvenlik ve Bütünlük Denetimi (DevSecOps SAST & Verification)
        run: |
          python3 scratch/verify_all.py
          python3 scratch/verify_plymouth.py
          npm audit --audit-level=high || echo "::warning::NPM bağımlılık uyarısı"

      - name: Ayaz DE İç Paketini Derle (yalnızca ISO içi enjeksiyon)
        run: |
          sed -i 's/\r$//' scripts/*.sh
          bash scripts/package-deb.sh
          if [ -f "dist/ayaz-de-latest-amd64.deb" ]; then
            echo "İç paket hazır: dist/ayaz-de-latest-amd64.deb (yayınlanmaz)"
          else
            echo "::error::İç paket üretilemedi!"
            exit 1
          fi

      - name: Ankora Linux Canlı ISO Kalıbını Pişir (build-iso.sh)
        run: |
          sudo bash scripts/build-iso.sh

      - name: ISO Bütünlük ve Boyut Denetimi
        run: |
          ls -lh dist/
          ISO_FILE=$(find dist -maxdepth 1 -name 'ankora-linux-*-ayaz-amd64.iso' | head -n 1)
          if [ -z "$ISO_FILE" ] || [ ! -f "$ISO_FILE" ]; then
            echo "::error::ISO dosyası dist dizininde bulunamadı!"
            exit 2
          fi
          echo "iso_file=$ISO_FILE" >> "$GITHUB_ENV"
          echo "iso_name=$(basename "$ISO_FILE")" >> "$GITHUB_ENV"
          echo "ISO başarıyla üretildi:"
          sha256sum "$ISO_FILE"

      - name: ISO ve Sağlama Toplamını GitHub Artifact Olarak Yükle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.iso_name }}
          path: |
            ${{ env.iso_file }}
            ${{ env.iso_file }}.sha256
          retention-days: 14

      - name: Sürüm (Release) Varsa ISO'yu Ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.iso_file }}
            ${{ env.iso_file }}.sha256
            dist/ayaz-de-latest-amd64.deb
          generate_release_notes: true
          name: Ankora Linux ${{ env.ankora_version }} (${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
