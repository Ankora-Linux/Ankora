name: Ayaz DE Sürüm Dağıtımı (Release Build)

# Bu iş akışı https://github.com/Ankora-Linux/Ayaz deposunda çalışır.
# Yeni bir sürüm etiketi (tag) push edildiğinde (örn: v2.0.1) tetiklenir.

on:
  push:
    tags:
      - 'v*'

# Sürüm yükleme (gh-release) GITHUB_TOKEN ile yazma izni ister.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Ayaz DE .deb Paketini Derle ve Yayınla
    runs-on: ubuntu-22.04

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Rust Araç Setini Kur
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: WebKitGTK ve Linux Bağımlılıklarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Tauri CLI Kur
        run: cargo install tauri-cli --version "^1.5"

      - name: Ayaz DE .deb Paketini Derle
        run: cargo tauri build --bundles deb

      - name: GitHub Sürümü (Release) Oluştur ve .deb Yükle
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true
          name: Ayaz DE ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
